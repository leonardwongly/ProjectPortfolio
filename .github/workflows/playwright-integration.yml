name: Playwright Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  nav-and-accordion:
    name: Navigation + Offline Integration
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run navigation, offline, and browser contract integration specs
        run: ./node_modules/.bin/playwright test tests/integration/mobile-nav-and-accordion.spec.mjs tests/integration/offline-fallback.spec.mjs tests/integration/browser-contracts.spec.mjs --config=playwright.config.mjs

      - name: Upload Playwright failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: playwright-integration-failure
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false
