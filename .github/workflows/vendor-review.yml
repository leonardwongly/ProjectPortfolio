name: Vendor Review

on:
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * 1'

permissions:
  contents: read

jobs:
  vendor-review:
    name: Vendored Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Validate vendored dependency governance
        run: node scripts/check-vendor-governance.mjs

      - name: Check vendored dependencies against declared upstream files
        run: node scripts/update-vendor.mjs --fail-on-drift

      - name: Check vendored dependencies against latest npm releases
        run: node scripts/check-vendor-upstream.mjs
