name: Link Health

on:
  workflow_dispatch:
  schedule:
    - cron: '12 4 * * 1'

permissions:
  contents: read

jobs:
  link-health:
    name: Live Link Health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Build generated pages
        run: npm run build

      - name: Check live external links
        run: npm run check:links -- --strict --timeout-ms 8000
