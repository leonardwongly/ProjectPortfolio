name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Build generated pages
        run: npm run build
      - name: Ensure generated files are committed
        run: npm run check:generated
      - name: Run security and content tests
        run: npm run test:security:coverage
